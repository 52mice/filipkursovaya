{% extends 'filipapp/base.html' %}

{% block content %}
    <h2>Список классов</h2>
    
    <table>
        <thead>
            <tr>
                <th width="50">ID</th>
                <th>Название класса</th>
                <th>Учебный год</th>
            </tr>
        </thead>
        <tbody>
            {% for class in classes %}
            <tr>
                <td>{{ class.id }}</td>
                <td>{{ class.name }}</td>
                <td>{{ class.academic_year }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" style="text-align: center; color: #777;">Классов пока нет. Добавьте их через панель управления.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
